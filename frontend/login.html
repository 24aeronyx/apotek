<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - POS Apotek Modern</title>
    <link rel="stylesheet" href="/static/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            min-height: 100vh; 
            margin: 0; 
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%); 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .login-wrapper {
            display: flex;
            background: white;
            border-radius: 16px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            overflow: hidden;
            width: 100%;
            max-width: 850px;
            border: 1px solid rgba(255,255,255,0.5);
        }
        .login-banner {
            background: linear-gradient(135deg, #2c3e50, #16a085);
            color: white;
            flex: 1;
            padding: 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }
        .login-banner i {
            font-size: 60px;
            color: #1abc9c;
            background: white;
            padding: 20px;
            border-radius: 50%;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }
        .login-banner h1 { margin: 0 0 10px 0; font-size: 24px; }
        .login-banner p { margin: 0; font-size: 14px; color: #bdc3c7; line-height: 1.5; }
        
        .login-card { 
            flex: 1; 
            padding: 40px; 
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .login-card h2 { margin-top: 0; color: #2c3e50; margin-bottom: 25px; font-size: 22px; display: flex; align-items: center; gap: 10px; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-weight: bold; margin-bottom: 8px; color: #34495e; font-size: 13px; text-transform: uppercase; letter-spacing: 0.5px; }
        .input-icon-wrapper { position: relative; }
        .input-icon-wrapper i { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: #95a5a6; }
        .form-group input { width: 100%; padding: 12px 12px 12px 40px; border: 1px solid #dcdde1; border-radius: 8px; box-sizing: border-box; font-size: 14px; transition: border-color 0.2s, box-shadow 0.2s; outline: none; }
        .form-group input:focus { border-color: #16a085; box-shadow: 0 0 0 3px rgba(22, 160, 133, 0.1); }
        
        .btn-login { background: #16a085; color: white; border: none; padding: 12px; width: 100%; border-radius: 8px; font-size: 15px; font-weight: bold; cursor: pointer; transition: background 0.2s, transform 0.1s; }
        .btn-login:hover { background: #138d75; }
        .btn-login:active { transform: scale(0.98); }
        
        #pesanLogin { margin-top: 15px; padding: 12px; border-radius: 8px; display: none; text-align: center; font-weight: bold; font-size: 13px; }

        @media (max-width: 768px) {
            .login-wrapper { flex-direction: column; max-width: 400px; margin: 20px; }
            .login-banner { padding: 30px; }
        }
    </style>
</head>
<body>

<div class="login-wrapper">
    <!-- Panel Samping Sambutan -->
    <div class="login-banner">
        <i class="fa-solid fa-pills"></i>
        <h1>Sistem POS Apotek</h1>
        <p>Kelola inventaris master obat, faktur pembelian batch, transaksi kasir, dan laporan keuangan dengan cepat dan terstruktur.</p>
    </div>

    <!-- Panel Form Login Utama -->
    <div class="login-card">
        <h2><i class="fa-solid fa-lock" style="color: #16a085; font-size: 18px;"></i> Masuk Akun</h2>
        <form id="formLogin" onsubmit="prosesLogin(event)">
            <div class="form-group">
                <label>Username</label>
                <div class="input-icon-wrapper">
                    <i class="fa-solid fa-user"></i>
                    <input type="text" id="username" required placeholder="Masukkan username...">
                </div>
            </div>
            <div class="form-group">
                <label>Password</label>
                <div class="input-icon-wrapper">
                    <i class="fa-solid fa-key"></i>
                    <input type="password" id="password" required placeholder="Masukkan password...">
                </div>
            </div>
            <button type="submit" class="btn-login"><i class="fa-solid fa-right-to-bracket" style="margin-right: 5px;"></i> Masuk ke Sistem</button>
        </form>
        <div id="pesanLogin"></div>
    </div>
</div>

<!-- Memanggil JavaScript dari file eksternal -->
<script src="/static/js/login.js"></script>

</body>
</html>
