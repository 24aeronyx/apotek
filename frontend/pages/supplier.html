<div class="container" style="max-width: 1100px; margin: auto;">
    <div class="card-section" style="background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); border: 1px solid #ecf0f1; margin-bottom: 20px;">
        
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; flex-wrap: wrap; gap: 10px;">
            <div style="display: flex; align-items: center; gap: 10px; width: 100%; max-width: 400px;">
                <input type="text" id="inputCariSupplier" class="search-input" placeholder="🔍 Cari nama supplier..." onkeyup="filterSupplier()" style="width: 100%; padding: 10px 15px; border: 1px solid #ccc; border-radius: 8px; font-size: 14px; outline: none;">
            </div>
            <button type="button" class="btn-tambah" onclick="bukaModalTambahSupplier()" style="background: #2ecc71; color: white; border: none; padding: 10px 18px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 14px; display: flex; align-items: center; gap: 8px;">
                <i class="fa-solid fa-plus"></i> Tambah Supplier Baru
            </button>
        </div>

        <div style="overflow-x: auto;">
            <table class="table-master" id="tabelSupplier" style="width: 100%; border-collapse: collapse; margin-top: 15px;">
                <thead>
                    <tr>
                        <th style="width: 25%; padding: 12px; border-bottom: 2px solid #ecf0f1; background: #f8f9fa; color: #2c3e50;">Nama Supplier</th>
                        <th style="width: 20%; padding: 12px; border-bottom: 2px solid #ecf0f1; background: #f8f9fa; color: #2c3e50;">Kontak</th>
                        <th style="width: 18%; padding: 12px; border-bottom: 2px solid #ecf0f1; background: #f8f9fa; color: #2c3e50;">Telepon</th>
                        <th style="width: 25%; padding: 12px; border-bottom: 2px solid #ecf0f1; background: #f8f9fa; color: #2c3e50;">Alamat</th>
                        <th style="width: 12%; text-align: center; padding: 12px; border-bottom: 2px solid #ecf0f1; background: #f8f9fa; color: #2c3e50;">Aksi</th>
                    </tr>
                </thead>
                <tbody>
                    <tr><td colspan="5" style="text-align: center; padding: 20px;">Memuat data supplier...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- Modal Form Tambah/Edit Supplier -->
<div id="modalSupplier" class="modal-overlay" style="display: none; align-items: center; justify-content: center; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000;">
    <div class="modal-content" style="background: white; padding: 25px; border-radius: 12px; width: 90%; max-width: 500px; box-shadow: 0 10px 25px rgba(0,0,0,0.2);">
        <h3 id="modalSupplierTitle" style="margin-top: 0; color: #2c3e50; border-bottom: 2px solid #ecf0f1; padding-bottom: 10px;">Tambah Supplier Baru</h3>
        <form id="formSupplier" onsubmit="simpanSupplier(event)">
            <input type="hidden" id="supplierId">
            <div class="form-group" style="margin-bottom: 15px;">
                <label style="display: block; margin-bottom: 5px; font-weight: bold; color: #2c3e50; font-size: 14px;">Nama Supplier / PBF: <span style="color: red;">*</span></label>
                <input type="text" id="namaSupplier" class="form-control" style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 14px;" placeholder="Contoh: PT Kimia Farma Trading" required>
            </div>
            <div class="form-group" style="margin-bottom: 15px;">
                <label style="display: block; margin-bottom: 5px; font-weight: bold; color: #2c3e50; font-size: 14px;">Nama Kontak (Sales):</label>
                <input type="text" id="kontakSupplier" class="form-control" style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 14px;" placeholder="Contoh: Bpk. Budi">
            </div>
            <div class="form-group" style="margin-bottom: 15px;">
                <label style="display: block; margin-bottom: 5px; font-weight: bold; color: #2c3e50; font-size: 14px;">No. Telepon:</label>
                <input type="text" id="teleponSupplier" class="form-control" style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 14px;" placeholder="Contoh: 08123456789">
            </div>
            <div class="form-group" style="margin-bottom: 15px;">
                <label style="display: block; margin-bottom: 5px; font-weight: bold; color: #2c3e50; font-size: 14px;">Alamat:</label>
                <textarea id="alamatSupplier" class="form-control" style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 14px;" rows="3" placeholder="Alamat lengkap supplier..."></textarea>
            </div>
            
            <div style="display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px;">
                <button type="button" onclick="tutupModalSupplier()" style="background: #95a5a6; color: white; border: none; padding: 10px 15px; border-radius: 6px; cursor: pointer; font-weight: bold;">Batal</button>
                <button type="submit" style="background: #2ecc71; color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-weight: bold;">Simpan</button>
            </div>
        </form>
    </div>
</div>

<!-- Modal Konfirmasi Hapus Supplier -->
<div id="modalHapusSupplier" class="modal-overlay" style="display: none; align-items: center; justify-content: center; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000;">
    <div class="modal-content" style="background: white; padding: 25px; border-radius: 12px; width: 90%; max-width: 400px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); text-align: center;">
        <div style="font-size: 45px; color: #e74c3c; margin-bottom: 10px;"><i class="fa-solid fa-triangle-exclamation"></i></div>
        <h3 style="margin-top: 0; color: #2c3e50;">Konfirmasi Hapus</h3>
        <p style="color: #555; font-size: 14px; margin-bottom: 20px;">Apakah Anda yakin ingin menghapus data supplier ini?</p>
        <input type="hidden" id="supplierIdDihapus">
        <div style="display: flex; gap: 10px; justify-content: center;">
            <button type="button" onclick="tutupModalHapusSupplier()" style="background: #95a5a6; color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-weight: bold;">Batal</button>
            <button type="button" onclick="eksekusiHapusSupplier()" style="background: #e74c3c; color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-weight: bold;">Ya, Hapus</button>
        </div>
    </div>
</div>

<!-- Modal Peringatan / Informasi Kustom -->
<div id="modalAlertSupplier" class="modal-overlay" style="display: none; align-items: center; justify-content: center; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000;">
    <div class="modal-content" style="background: white; padding: 25px; border-radius: 12px; width: 90%; max-width: 400px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); text-align: center;">
        <div id="alertSupplierIcon" style="font-size: 45px; color: #3498db; margin-bottom: 10px;"><i class="fa-solid fa-circle-info"></i></div>
        <h3 style="margin-top: 0; color: #2c3e50;" id="alertSupplierTitle">Informasi</h3>
        <p style="color: #555; font-size: 14px; margin-bottom: 20px;" id="alertSupplierMessage">Pesan sistem...</p>
        <button type="button" onclick="tutupModalAlertSupplier()" style="background: #3498db; color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-weight: bold; width: 100%;">OK</button>
    </div>
</div>

<!-- Memanggil JavaScript Supplier -->
<script src="/static/js/supplier.js"></script>
