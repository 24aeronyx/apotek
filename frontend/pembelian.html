<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Input Pembelian Stok (Faktur) - Apotek</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .container { max-width: 800px; margin: auto; padding: 20px; }
        .card-section { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); border: 1px solid #ecf0f1; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: bold; color: #2c3e50; font-size: 14px; }
        .form-control { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 14px; }
        .btn-simpan { background: #2ecc71; color: white; border: none; padding: 12px 20px; border-radius: 6px; cursor: pointer; font-weight: bold; width: 100%; font-size: 16px; margin-top: 10px; }
        .btn-simpan:hover { background: #27ae60; }
        
        /* Modal Kustom Bersih Tanpa Alert Bawaan Browser */
        .modal-overlay { display: none; align-items: center; justify-content: center; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; }
        .modal-content { background: white; padding: 25px; border-radius: 12px; width: 90%; max-width: 400px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); text-align: center; }
    </style>
</head>
<body>

<div class="header">
    <h2><i class="fa-solid fa-truck-ramp-box" style="color: #1abc9c;"></i> Input Faktur Pembelian Stok</h2>
    <div style="display: flex; gap: 10px; align-items: center; flex-wrap: wrap;">
        <a href="index.html" style="text-decoration: none; background: #3498db; color: white; padding: 10px 15px; border-radius: 20px; font-weight: bold; font-size: 14px;"><i class="fa-solid fa-cash-register"></i> Kasir</a>
        <a href="pembelian.html" style="text-decoration: none; background: #2ecc71; color: white; padding: 10px 15px; border-radius: 20px; font-weight: bold; font-size: 14px;"><i class="fa-solid fa-truck-ramp-box"></i> Input Stok</a>
        <a href="master_obat.html" style="text-decoration: none; background: #f39c12; color: white; padding: 10px 15px; border-radius: 20px; font-weight: bold; font-size: 14px;"><i class="fa-solid fa-boxes-stacked"></i> Master Obat</a>
        <a href="dashboard.html" style="text-decoration: none; background: #8e44ad; color: white; padding: 10px 15px; border-radius: 20px; font-weight: bold; font-size: 14px;"><i class="fa-solid fa-chart-pie"></i> Dashboard</a>
        <button onclick="localStorage.removeItem('user_apotek'); window.location.href='login.html';" style="background: #e74c3c; color: white; border: none; padding: 10px 15px; border-radius: 20px; cursor: pointer; font-weight: bold; font-size: 14px;"><i class="fa-solid fa-right-from-bracket"></i> Keluar</button>
    </div>
</div>

<div class="container">
    <div class="card-section">
        <form id="formPembelian" onsubmit="simpanPembelian(event)">
            <div class="form-group">
                <label>Pilih Obat (Dari Master): <span style="color: red;">*</span></label>
                <select id="selectObat" class="form-control" required>
                    <option value="">-- Memuat daftar obat --</option>
                </select>
            </div>
            
            <div class="form-group">
                <label>Nomor Faktur / No. Batch: <span style="color: red;">*</span></label>
                <input type="text" id="nomorBatch" class="form-control" placeholder="Contoh: FAC-2026-0801" required>
            </div>

            <div class="form-group">
                <label>Jumlah Stok Masuk (Kuantiti): <span style="color: red;">*</span></label>
                <input type="number" id="jumlahStok" class="form-control" min="1" placeholder="Contoh: 100" required>
            </div>

            <div class="form-group">
                <label>Harga Beli Satuan (Modal): <span style="color: red;">*</span></label>
                <input type="number" id="hargaBeli" class="form-control" min="0" placeholder="Contoh: 3500" required>
            </div>

            <div class="form-group">
                <label>Tanggal Kedaluwarsa (Expired Date): <span style="color: red;">*</span></label>
                <input type="date" id="tglExpired" class="form-control" required>
            </div>

            <button type="submit" class="btn-simpan"><i class="fa-solid fa-floppy-disk"></i> Simpan & Tambah Stok</button>
        </form>
    </div>
</div>

<!-- Modal Kustom untuk Peringatan / Pesan -->
<div id="modalAlert" class="modal-overlay">
    <div class="modal-content">
        <div id="alertIcon" style="font-size: 45px; color: #2ecc71; margin-bottom: 10px;"><i class="fa-solid fa-circle-check"></i></div>
        <h3 style="margin-top: 0; color: #2c3e50;" id="alertTitle">Informasi</h3>
        <p style="color: #555; font-size: 14px; margin-bottom: 20px;" id="alertMessage">Pesan informasi.</p>
        <button type="button" onclick="tutupModalAlert()" style="background: #3498db; color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-weight: bold; width: 100%;">OK</button>
    </div>
</div>

<script>
    function tampilkanAlert(judul, pesan, tipe = "sukses") {
        document.getElementById('alertTitle').innerText = judul;
        document.getElementById('alertMessage').innerText = pesan;
        
        const iconDiv = document.getElementById('alertIcon');
        if (tipe === "sukses") {
            iconDiv.style.color = "#2ecc71";
            iconDiv.innerHTML = '<i class="fa-solid fa-circle-check"></i>';
        } else {
            iconDiv.style.color = "#e67e22";
            iconDiv.innerHTML = '<i class="fa-solid fa-circle-exclamation"></i>';
        }

        document.getElementById('modalAlert').style.display = 'flex';
    }

    function tutupModalAlert() {
        document.getElementById('modalAlert').style.display = 'none';
    }

    // 1. Muat daftar obat ke dropdown saat halaman dibuka
    async function muatDropdownObat() {
        try {
            const response = await fetch('http://127.0.0.1:8000/obat');
            const data = await response.json();
            const select = document.getElementById('selectObat');
            
            select.innerHTML = '<option value="">-- Pilih Obat --</option>';
            data.forEach(obat => {
                select.innerHTML += `<option value="${obat.id}">${obat.nama} (Kategori: ${obat.kategori})</option>`;
            });
        } catch (error) {
            console.error("Gagal memuat master obat:", error);
            tampilkanAlert("Kesalahan Koneksi", "Gagal terhubung ke server untuk memuat master obat.", "error");
        }
    }

    // 2. Kirim data pembelian stok baru ke backend
    async function simpanPembelian(event) {
        event.preventDefault();

        const payload = {
            medicine_id: parseInt(document.getElementById('selectObat').value),
            nomor_batch: document.getElementById('nomorBatch').value,
            jumlah_stok: parseInt(document.getElementById('jumlahStok').value),
            harga_beli: parseInt(document.getElementById('hargaBeli').value),
            tanggal_kedaluwarsa: document.getElementById('tglExpired').value
        };

        try {
            const response = await fetch('http://127.0.0.1:8000/pembelian', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            const result = await response.json();

            if (response.ok) {
                tampilkanAlert("Berhasil", "Stok berhasil ditambahkan ke batch baru!", "sukses");
                document.getElementById('formPembelian').reset();
            } else {
                tampilkanAlert("Gagal Menyimpan", result.detail || 'Terjadi kesalahan pada sistem.', "error");
            }
        } catch (error) {
            tampilkanAlert("Kesalahan Koneksi", "Gagal terhubung ke server backend!", "error");
        }
    }

    window.onload = muatDropdownObat;
</script>

</body>
</html>
