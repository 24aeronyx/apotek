<div class="container" style="max-width: 800px; margin: auto;">
    <div class="card-section" style="background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); border: 1px solid #ecf0f1;">
        <h3 style="margin-top: 0; margin-bottom: 20px; color: #2c3e50; font-size: 18px; font-weight: bold;">
            <i class="fa-solid fa-truck-ramp-box" style="color: #1abc9c;"></i> Input Faktur Pembelian Stok
        </h3>
        
        <form id="formPembelian" onsubmit="simpanPembelian(event)">
            <div class="form-group" style="margin-bottom: 15px;">
                <label style="display: block; margin-bottom: 5px; font-weight: bold; color: #2c3e50; font-size: 14px;">Pilih Obat (Dari Master): <span style="color: red;">*</span></label>
                <select id="selectObat" class="form-control" style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 14px;" required>
                    <option value="">-- Memuat daftar obat --</option>
                </select>
            </div>
            
            <div class="form-group" style="margin-bottom: 15px;">
                <label style="display: block; margin-bottom: 5px; font-weight: bold; color: #2c3e50; font-size: 14px;">Nomor Faktur / No. Batch: <span style="color: red;">*</span></label>
                <input type="text" id="nomorBatch" class="form-control" style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 14px;" placeholder="Contoh: FAC-2026-0801" required>
            </div>

            <div class="form-group" style="margin-bottom: 15px;">
                <label style="display: block; margin-bottom: 5px; font-weight: bold; color: #2c3e50; font-size: 14px;">Jumlah Stok Masuk (Kuantiti): <span style="color: red;">*</span></label>
                <input type="number" id="jumlahStok" class="form-control" style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 14px;" min="1" placeholder="Contoh: 100" required>
            </div>

            <div class="form-group" style="margin-bottom: 15px;">
                <label style="display: block; margin-bottom: 5px; font-weight: bold; color: #2c3e50; font-size: 14px;">Harga Beli Satuan (Modal): <span style="color: red;">*</span></label>
                <input type="number" id="hargaBeli" class="form-control" style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 14px;" min="0" placeholder="Contoh: 3500" required>
            </div>

            <div class="form-group" style="margin-bottom: 15px;">
                <label style="display: block; margin-bottom: 5px; font-weight: bold; color: #2c3e50; font-size: 14px;">Tanggal Kedaluwarsa (Expired Date): <span style="color: red;">*</span></label>
                <input type="date" id="tglExpired" class="form-control" style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 14px;" required>
            </div>

            <button type="submit" class="btn-simpan" style="background: #2ecc71; color: white; border: none; padding: 12px 20px; border-radius: 6px; cursor: pointer; font-weight: bold; width: 100%; font-size: 16px; margin-top: 10px;"><i class="fa-solid fa-floppy-disk"></i> Simpan & Tambah Stok</button>
        </form>
    </div>
</div>

<!-- Modal Kustom untuk Peringatan / Pesan -->
<div id="modalAlert" class="modal-overlay" style="display: none; align-items: center; justify-content: center; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000;">
    <div class="modal-content" style="background: white; padding: 25px; border-radius: 12px; width: 90%; max-width: 400px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); text-align: center;">
        <div id="alertIcon" style="font-size: 45px; color: #2ecc71; margin-bottom: 10px;"><i class="fa-solid fa-circle-check"></i></div>
        <h3 style="margin-top: 0; color: #2c3e50;" id="alertTitle">Informasi</h3>
        <p style="color: #555; font-size: 14px; margin-bottom: 20px;" id="alertMessage">Pesan informasi.</p>
        <button type="button" onclick="tutupModalAlert()" style="background: #3498db; color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-weight: bold; width: 100%;">OK</button>
    </div>
</div>

<!-- Memanggil JavaScript dari file eksternal -->
<script src="/static/js/pembelian.js"></script>
