<!-- Konten Kasir Utama -->
<div class="container" style="max-width: 100%; padding: 0;">
    <div class="product-grid" id="productGrid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 15px;"></div>
</div>

<!-- Tombol Mengambang (Floating Cart Button) -->
<button class="btn-floating" onclick="toggleModal(true)" style="position: fixed; bottom: 30px; right: 30px; background: #1abc9c; color: white; border: none; padding: 12px 20px; border-radius: 30px; font-weight: bold; box-shadow: 0 4px 15px rgba(0,0,0,0.2); cursor: pointer; z-index: 99;">
    🛒 Keranjang <span class="badge" id="cartCount" style="background: #e74c3c; padding: 3px 8px; border-radius: 50%;">0</span>
</button>

<!-- Modal Keranjang / Detail Transaksi -->
<div class="modal-overlay" id="cartModal" style="display: none; align-items: center; justify-content: center; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000;">
    <div class="modal-content" style="background: white; padding: 25px; border-radius: 12px; width: 90%; max-width: 500px; box-shadow: 0 10px 25px rgba(0,0,0,0.2);">
        <div class="modal-header" style="display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #ecf0f1; padding-bottom: 10px; margin-bottom: 15px;">
            <h3 style="margin: 0; color: #2c3e50;">Detail Transaksi</h3>
            <button class="close-btn" onclick="toggleModal(false)" style="background: none; border: none; font-size: 22px; cursor: pointer; color: #7f8c8d;">&times;</button>
        </div>
        
        <table id="tabelKeranjang" style="width: 100%; border-collapse: collapse; text-align: left;">
            <thead>
                <tr style="background: #f8f9fa;">
                    <th style="padding: 10px; border-bottom: 2px solid #ecf0f1;">Obat</th>
                    <th style="padding: 10px; border-bottom: 2px solid #ecf0f1;">Jml</th>
                    <th style="padding: 10px; border-bottom: 2px solid #ecf0f1;">Subtotal</th>
                    <th style="padding: 10px; border-bottom: 2px solid #ecf0f1; text-align: center;">Aksi</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>

        <div style="text-align: right; margin-top: 15px; font-size: 18px; font-weight: bold;">
            Total Bayar: <span id="grandTotal" style="color: #27ae60;">Rp 0</span>
        </div>

        <button class="btn-proses" onclick="prosesTransaksi()" style="background: #2ecc71; color: white; border: none; padding: 12px; width: 100%; border-radius: 8px; font-weight: bold; margin-top: 15px; cursor: pointer;">✔ Proses Pembayaran</button>
        <div id="pesan" style="margin-top: 10px; text-align: center; font-weight: bold;"></div>
    </div>
</div>

<!-- Modal Pop-up Riwayat Transaksi -->
<div class="modal-overlay" id="riwayatModal" style="display: none; align-items: center; justify-content: center; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000;">
    <div class="modal-content" style="background: white; padding: 25px; border-radius: 12px; width: 90%; max-width: 700px; box-shadow: 0 10px 25px rgba(0,0,0,0.2);">
        <div class="modal-header" style="display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #ecf0f1; padding-bottom: 10px; margin-bottom: 15px;">
            <h3 style="margin: 0; color: #2c3e50;">📜 Riwayat Transaksi</h3>
            <button class="close-btn" onclick="tutupRiwayat()" style="background: none; border: none; font-size: 22px; cursor: pointer; color: #7f8c8d;">&times;</button>
        </div>
        
        <div style="max-height: 350px; overflow-y: auto;">
            <table id="tabelRiwayat" style="width: 100%; border-collapse: collapse; text-align: left;">
                <thead>
                    <tr style="background: #f8f9fa;">
                        <th style="padding: 10px; border-bottom: 2px solid #ecf0f1;">ID Nota</th>
                        <th style="padding: 10px; border-bottom: 2px solid #ecf0f1;">Kasir</th>
                        <th style="padding: 10px; border-bottom: 2px solid #ecf0f1;">Waktu</th>
                        <th style="padding: 10px; border-bottom: 2px solid #ecf0f1;">Total Item</th>
                        <th style="padding: 10px; border-bottom: 2px solid #ecf0f1; text-align: center;">Aksi</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Data riwayat akan dimuat di sini -->
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- Area Struk Tersembunyi untuk Printer -->
<div id="areaStruk" style="display: none;">
    <div style="width: 300px; font-family: 'Courier New', Courier, monospace; font-size: 12px; padding: 10px; color: black;">
        <div style="text-align: center; border-bottom: 1px dashed black; padding-bottom: 5px; margin-bottom: 5px;">
            <h3 style="margin: 0;">APOTEK SEHAT MANDIRI</h3>
            <p style="margin: 2px 0;">Jl. Contoh No. 123, Kota Anda</p>
        </div>
        <div style="margin-bottom: 5px;">
            <p style="margin: 2px 0;">No. Nota : <span id="strukId">-</span></p>
            <p style="margin: 2px 0;">Waktu  : <span id="strukWaktu">-</span></p>
        </div>
        <div style="border-top: 1px dashed black; border-bottom: 1px dashed black; padding: 5px 0; margin-bottom: 5px;">
            <table style="width: 100%; font-size: 12px; border-collapse: collapse;">
                <tbody id="strukItemBody"></tbody>
            </table>
        </div>
        <div style="text-align: right; font-weight: bold; margin-bottom: 10px;">
            <p style="margin: 2px 0;">TOTAL: <span id="strukTotal">Rp 0</span></p>
        </div>
        <div style="text-align: center; border-top: 1px dashed black; padding-top: 5px;">
            <p style="margin: 2px 0;">Terima Kasih</p>
        </div>
    </div>
</div>

<!-- Sertakan skrip kasir dan struk agar terpanggil saat halaman dimuat -->
<script src="/static/js/struk.js"></script>
<script src="/static/js/app.js"></script>
