<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Input Stok Massal (Bulk) - Apotek</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .table-input { width: 100%; border-collapse: collapse; margin-top: 15px; }
        .table-input th, .table-input td { padding: 10px; border: 1px solid #ecf0f1; text-align: left; }
        .table-input th { background: #f8f9fa; }
        .input-cell { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
        .btn-action-row { background: #e74c3c; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .btn-action-row:hover { background: #c0392b; }
        .btn-tambah-baris { background: #3498db; color: white; border: none; padding: 10px 15px; border-radius: 6px; cursor: pointer; font-weight: bold; margin-top: 15px; }
        .btn-simpan-semua { background: #2ecc71; color: white; border: none; padding: 12px 20px; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 20px; width: 100%; }
        
        /* Styling tambahan untuk Modal Pop-up */
        .modal-overlay { display: none; align-items: center; justify-content: center; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 2000; }
        .modal-content { background: white; padding: 25px; border-radius: 12px; width: 90%; max-width: 400px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.2); }
    </style>
</head>
<body>

<div class="header">
    <h2>📦 Input Stok Massal (Bulk)</h2>
    <div>
        <a href="index.html" style="text-decoration: none; background: #3498db; color: white; padding: 10px 15px; border-radius: 20px; font-weight: bold; font-size: 14px;">🛒 Ke Kasir</a>
        <button onclick="bukaRiwayat()" style="background: #3498db; color: white; border: none; padding: 10px 15px; border-radius: 20px; cursor: pointer; font-weight: bold;">📜 Riwayat</button>
        <a href="stok_bulk.html" style="text-decoration: none; background: #2ecc71; color: white; padding: 10px 15px; border-radius: 20px; font-weight: bold; font-size: 14px;">📦 Input Stok</a>
        <a href="dashboard.html" style="text-decoration: none; background: #8e44ad; color: white; padding: 10px 15px; border-radius: 20px; font-weight: bold; font-size: 14px;">📊 Dashboard</a>
        <button onclick="localStorage.removeItem('user_apotek'); window.location.href='login.html';" style="background: #e74c3c; color: white; border: none; padding: 10px 15px; border-radius: 20px; cursor: pointer; font-weight: bold; font-size: 14px;">🚪 Keluar</button>
    </div>
</div>

<div class="container" style="max-width: 1000px;">
    <div style="background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); border: 1px solid #ecf0f1;">
        <h3 style="margin-top: 0; color: #2c3e50; border-bottom: 2px solid #ecf0f1; padding-bottom: 10px;">Daftar Obat Masuk</h3>
        <p style="color: #7f8c8d; font-size: 14px;">Tambahkan baris sebanyak yang Anda inginkan, isi datanya, lalu klik simpan untuk memasukkan semuanya sekaligus secara instan.</p>

        <div id="formBulkStok">
            <table class="table-input" id="tabelInputBulk">
                <thead>
                    <tr>
                        <th style="width: 20%;">Nama Obat</th>
                        <th style="width: 15%;">Kategori</th>
                        <th style="width: 13%;">Harga Jual</th>
                        <th style="width: 10%;">Jumlah</th>
                        <th style="width: 17%;">Kedaluwarsa</th>
                        <th style="width: 15%;">Link Gambar</th>
                        <th style="width: 10%; text-align: center;">Aksi</th>
                    </tr>
                </thead>
                <tbody id="tbodyBulk">
                    <!-- Baris input dinamis ditambahkan lewat JavaScript -->
                </tbody>
            </table>

            <button type="button" class="btn-tambah-baris" onclick="tambahBarisInput()"><i class="fa-solid fa-plus"></i> Tambah Obat</button>
            <button type="button" class="btn-simpan-semua" onclick="kirimDataBulk(event)"><i class="fa-solid fa-floppy-disk"></i> Simpan Semua ke Database</button>
        </div>
    </div>
</div>

<!-- Modal Pop-up Notifikasi Sukses/Gagal -->
<div id="modalNotif" class="modal-overlay">
    <div class="modal-content">
        <div id="ikonModal" style="font-size: 40px; margin-bottom: 15px;">✅</div>
        <h3 id="judulModal" style="margin: 0 0 10px 0; color: #2c3e50;">Berhasil!</h3>
        <p id="pesanModal" style="color: #555; font-size: 14px; margin-bottom: 20px; line-height: 1.5;"></p>
        <button type="button" onclick="tutupModalNotif()" style="background: #2ecc71; color: white; border: none; padding: 10px 20px; border-radius: 6px; font-weight: bold; cursor: pointer; width: 100%; font-size: 15px;">OK / Tutup</button>
    </div>
</div>

<script>
    window.onload = function() {
        tambahBarisInput();
    };

    function tambahBarisInput() {
        const tbody = document.getElementById("tbodyBulk");
        const tr = document.createElement("tr");

        tr.innerHTML = `
            <td><input type="text" class="nama-obat" placeholder="Nama obat..." required style="width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px;"></td>
            <td><input type="text" class="kategori" value="Umum" required style="width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px;"></td>
            <td><input type="number" class="harga" value="0" min="0" required style="width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px;"></td>
            <td><input type="number" class="jumlah" value="1" min="1" required style="width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px;"></td>
            <td><input type="date" class="tgl" required style="width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px;"></td>
            <td>
                <input type="file" class="input-file-gambar" accept="image/*" 
                    style="width: 100%; font-size: 11px; padding: 4px; box-sizing: border-box; background: #f8fafc; border: 1px dashed #cbd5e1; border-radius: 4px; cursor: pointer;">
            </td>
            <td style="text-align: center;">
                <button type="button" class="btn-hapus" onclick="hapusBaris(this)" style="background: #e74c3c; color: white; border: none; padding: 6px 10px; border-radius: 4px; cursor: pointer;">X</button>
            </td>
        `;
        tbody.appendChild(tr);
    }

    function hapusBaris(button) {
        const row = button.closest('tr');
        const tbody = document.getElementById('tbodyBulk');
        
        if (tbody.rows.length > 1) {
            row.remove();
        } else {
            alert("Minimal harus ada 1 baris input!");
        }
    }

    // Fungsi helper mandiri untuk upload satu file gambar
    async function uploadFileGambar(file) {
        const formData = new FormData();
        formData.append("file", file);

        const response = await fetch('http://127.0.0.1:8000/upload-gambar', {
            method: 'POST',
            body: formData
        });

        const textRes = await response.text();
        let data;
        try {
            data = JSON.parse(textRes);
        } catch (e) {
            throw new Error("Respon server upload gambar tidak valid.");
        }

        if (!response.ok) {
            throw new Error(data.detail || "Gagal mengunggah gambar.");
        }
        return data.url_gambar || "";
    }

    async function kirimDataBulk(event) {
        if (event) {
            event.preventDefault();
            event.stopPropagation();
        }

        const modal = document.getElementById('modalNotif');
        const judulModal = document.getElementById('judulModal');
        const pesanModal = document.getElementById('pesanModal');
        const ikonModal = document.getElementById('ikonModal');

        // 1. Tampilkan modal status loading secara eksplisit
        ikonModal.innerHTML = '⏳';
        judulModal.innerText = "Memproses...";
        pesanModal.innerText = "Sedang memproses data dan mengunggah gambar...";
        modal.style.display = 'flex';

        const rows = document.querySelectorAll('#tbodyBulk tr');
        let itemsArray = [];

        try {
            // 2. Iterasi baris dan proses upload gambar secara aman
            for (let row of rows) {
                const fileInput = row.querySelector('.input-file-gambar');
                let urlGambarFinal = "";

                if (fileInput && fileInput.files.length > 0) {
                    // Upload gambar satu per satu per baris dengan aman
                    urlGambarFinal = await uploadFileGambar(fileInput.files[0]);
                }

                itemsArray.push({
                    nama_obat: row.querySelector('.nama-obat').value,
                    kategori: row.querySelector('.kategori').value,
                    harga_jual: parseInt(row.querySelector('.harga').value) || 0,
                    jumlah: parseInt(row.querySelector('.jumlah').value) || 0,
                    tanggal_kedaluwarsa: row.querySelector('.tgl').value,
                    gambar: urlGambarFinal
                });
            }

            // 3. Kirim kumpulan data ke endpoint database bulk
            const response = await fetch('http://127.0.0.1:8000/stok/tambah-banyak', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ items: itemsArray })
            });

            const textBulk = await response.text();
            let resultData;
            try {
                resultData = JSON.parse(textBulk);
            } catch (e) {
                throw new Error("Respon database bulk tidak valid.");
            }

            if (response.ok) {
                // 4. Ubah status modal menjadi sukses BERSIH tanpa refresh/tertutup sendiri
                ikonModal.innerHTML = '✅';
                judulModal.innerText = "Berhasil!";
                pesanModal.innerHTML = `<b>${itemsArray.length}</b> jenis obat/batch berhasil ditambahkan ke database.`;
                
                // Kosongkan tabel di latar belakang setelah modal sukses berdiri stabil
                document.getElementById('tbodyBulk').innerHTML = '';
                tambahBarisInput();
            } else {
                ikonModal.innerHTML = '❌';
                judulModal.innerText = "Gagal!";
                pesanModal.innerText = resultData.detail || 'Terjadi kesalahan pada server database.';
            }

        } catch (error) {
            ikonModal.innerHTML = '⚠️';
            judulModal.innerText = "Terjadi Kesalahan!";
            pesanModal.innerText = error.message || 'Gagal terhubung ke server backend!';
        }
    }

    function tutupModalNotif() {
        document.getElementById('modalNotif').style.display = 'none';
    }
</script>

</body>
</html>
