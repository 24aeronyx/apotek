<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stok Opname & Pemusnahan - POS Apotek</title>
    <link rel="stylesheet" href="/static/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #f4f7f6; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .container { max-width: 1100px; margin: auto; padding: 20px; }
        .card-section { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); border: 1px solid #ecf0f1; }
        
        /* Menyesuaikan ukuran judul agar seragam sekitar 24px */
        .header h2 { font-size: 24px; margin: 0; display: flex; align-items: center; gap: 10px; }
        
        /* Modal Kustom Bersih Tanpa Konflik Bootstrap */
        .modal-overlay { display: none; align-items: center; justify-content: center; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; }
        .modal-content-custom { background: white; padding: 25px; border-radius: 12px; width: 90%; max-width: 450px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); text-align: left; }
    </style>
</head>
<body>

<!-- Header / Navbar Konsisten -->
<div class="header">
    <h2><i class="fa-solid fa-boxes-packing" style="color: #16a085;"></i> Stok Opname & Pemusnahan</h2>
    <div style="display: flex; gap: 10px; align-items: center; flex-wrap: wrap;">
        <a href="index.html" style="text-decoration: none; background: #3498db; color: white; padding: 10px 15px; border-radius: 20px; font-weight: bold; font-size: 14px;"><i class="fa-solid fa-cash-register"></i> Kasir</a>
        <a href="pembelian.html" style="text-decoration: none; background: #2ecc71; color: white; padding: 10px 15px; border-radius: 20px; font-weight: bold; font-size: 14px;"><i class="fa-solid fa-truck-ramp-box"></i> Input Stok</a>
        <a href="master_obat.html" style="text-decoration: none; background: #f39c12; color: white; padding: 10px 15px; border-radius: 20px; font-weight: bold; font-size: 14px;"><i class="fa-solid fa-boxes-stacked"></i> Master Obat</a>
        <a href="stok_opname.html" style="text-decoration: none; background: #16a085; color: white; padding: 10px 15px; border-radius: 20px; font-weight: bold; font-size: 14px;"><i class="fa-solid fa-boxes-packing"></i> Stok Opname</a>
        <a href="dashboard.html" style="text-decoration: none; background: #8e44ad; color: white; padding: 10px 15px; border-radius: 20px; font-weight: bold; font-size: 14px;"><i class="fa-solid fa-chart-pie"></i> Dashboard</a>
        <button onclick="localStorage.removeItem('user_apotek'); window.location.href='login.html';" style="background: #e74c3c; color: white; border: none; padding: 10px 15px; border-radius: 20px; cursor: pointer; font-weight: bold; font-size: 14px;"><i class="fa-solid fa-right-from-bracket"></i> Keluar</button>
    </div>
</div>

<!-- Main Container -->
<div class="container">
    <div class="card-section">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 10px;">
            <h3 style="font-size: 18px; margin: 0; color: #2c3e50; font-weight: bold;">Daftar Batch Obat untuk Opname</h3>
            <input type="text" id="searchInput" class="form-control" style="width: 250px; padding: 8px; border: 1px solid #ccc; border-radius: 6px;" placeholder="Cari obat / no batch...">
        </div>

        <div style="overflow-x: auto;">
            <table style="width: 100%; border-collapse: collapse; text-align: left;" id="tableOpname">
                <thead>
                    <tr style="background: #f8f9fa; border-bottom: 2px solid #dee2e6;">
                        <th style="padding: 12px;">No Batch</th>
                        <th style="padding: 12px;">Nama Obat</th>
                        <th style="padding: 12px;">Harga Beli</th>
                        <th style="padding: 12px;">ED (Kedaluwarsa)</th>
                        <th style="padding: 12px;">Stok Sistem</th>
                        <th style="padding: 12px; text-align: center;">Aksi Opname</th>
                    </tr>
                </thead>
                <tbody id="batchTableBody">
                    <!-- Data Batch obat akan di-render di sini lewat JS -->
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- Modal Form Stok Opname (Custom Tanpa Konflik Bootstrap) -->
<div class="modal-overlay" id="modalOpname">
    <div class="modal-content-custom">
        <div style="background: #27ae60; color: white; padding: 15px; border-top-left-radius: 12px; border-top-right-radius: 12px; display: flex; justify-content: space-between; align-items: center; margin: -25px -25px 20px -25px;">
            <h5 style="margin: 0; font-size: 16px;"><i class="fa-solid fa-clipboard-check"></i> Form Penyesuaian Stok</h5>
            <button type="button" onclick="tutupOpnameModal()" style="background: none; border: none; color: white; font-size: 20px; cursor: pointer;">&times;</button>
        </div>
        
        <form id="formOpname">
            <input type="hidden" id="opnameBatchId">
            
            <div style="margin-bottom: 15px;">
                <label style="display: block; margin-bottom: 5px; font-weight: bold; font-size: 13px; color: #555;">Nama Obat / Batch</label>
                <input type="text" id="opnameNamaObat" style="width: 100%; padding: 8px; background: #f8f9fa; border: 1px solid #ccc; border-radius: 6px;" readonly>
            </div>
            
            <div style="display: flex; gap: 10px; margin-bottom: 15px;">
                <div style="flex: 1;">
                    <label style="display: block; margin-bottom: 5px; font-weight: bold; font-size: 13px; color: #555;">Stok di Sistem</label>
                    <input type="number" id="opnameStokLama" style="width: 100%; padding: 8px; background: #f8f9fa; border: 1px solid #ccc; border-radius: 6px;" readonly>
                </div>
                <div style="flex: 1;">
                    <label style="display: block; margin-bottom: 5px; font-weight: bold; font-size: 13px; color: #27ae60;">Stok Fisik Real</label>
                    <input type="number" id="opnameStokBaru" style="width: 100%; padding: 8px; border: 1px solid #27ae60; border-radius: 6px;" required min="0">
                </div>
            </div>

            <div style="margin-bottom: 15px;">
                <label style="display: block; margin-bottom: 5px; font-weight: bold; font-size: 13px; color: #555;">Keterangan / Alasan</label>
                <select id="opnameKeterangan" style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 6px;" required>
                    <option value="Stok Opname Rutin">Stok Opname Rutin</option>
                    <option value="Pemusnahan Barang Kedaluwarsa (ED)">Pemusnahan Barang Kedaluwarsa (ED)</option>
                    <option value="Barang Rusak / Pecah">Barang Rusak / Pecah</option>
                    <option value="Selisih Hitungan Kasir">Selisih Hitungan Kasir</option>
                    <option value="Lainnya">Lainnya</option>
                </select>
            </div>

            <div style="margin-bottom: 20px;">
                <label style="display: block; margin-bottom: 5px; font-weight: bold; font-size: 13px; color: #555;">Catatan Tambahan (Opsional)</label>
                <textarea id="opnameCatatan" style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 6px;" rows="2" placeholder="Contoh: Ditemukan botol pecah di rak A3"></textarea>
            </div>

            <div style="display: flex; justify-content: flex-end; gap: 10px;">
                <button type="button" onclick="tutupOpnameModal()" style="background: #95a5a6; color: white; border: none; padding: 8px 15px; border-radius: 6px; cursor: pointer; font-weight: bold;">Batal</button>
                <button type="submit" style="background: #27ae60; color: white; border: none; padding: 8px 15px; border-radius: 6px; cursor: pointer; font-weight: bold;"><i class="fa-solid fa-floppy-disk"></i> Simpan Penyesuaian</button>
            </div>
        </form>
    </div>
</div>

<script src="/static/js/stok_opname.js"></script>
<script>
    // Fungsi buka/tutup modal murni JS tanpa bergantung pada Bootstrap JS
    function tutupOpnameModal() {
        document.getElementById('modalOpname').style.display = 'none';
    }
    // Jika script eksternal menggunakan modal.show(), pastikan disesuaikan atau gunakan fungsi display flex ini
</script>
</body>
</html>
