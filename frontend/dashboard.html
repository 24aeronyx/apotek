<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard & Laporan - Apotek</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .stats-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; margin-bottom: 25px; }
        .stat-card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); border: 1px solid #ecf0f1; text-align: center; }
        .stat-card h4 { margin: 0 0 10px 0; color: #7f8c8d; font-size: 14px; text-transform: uppercase; }
        .stat-card p { margin: 0; color: #2c3e50; font-size: 24px; font-weight: bold; }
        .card-section { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); border: 1px solid #ecf0f1; margin-bottom: 20px; }
    </style>
</head>
<body>

<div class="header">
    <h2>📊 Dashboard & Laporan Keuangan</h2>
    <div style="display: flex; gap: 10px;">
        <a href="index.html" style="text-decoration: none; background: #3498db; color: white; padding: 10px 15px; border-radius: 20px; font-weight: bold; font-size: 14px;">🛒 Ke Kasir</a>
        <a href="stok_bulk.html" style="text-decoration: none; background: #2ecc71; color: white; padding: 10px 15px; border-radius: 20px; font-weight: bold; font-size: 14px;">📦 Input Stok</a>
    </div>
</div>

<div class="container" style="max-width: 1100px;">
    
    <!-- Kotak Ringkasan Statistik (KPI Cards) -->
    <div class="stats-container">
        <div class="stat-card">
            <h4>Total Transaksi Sukses</h4>
            <p id="statTotalTransaksi" style="color: #3498db;">0</p>
        </div>
        <div class="stat-card">
            <h4>Total Item Terjual</h4>
            <p id="statTotalItem" style="color: #e67e22;">0</p>
        </div>
        <div class="stat-card">
            <h4>Estimasi Pendapatan</h4>
            <p id="statTotalOmzet" style="color: #27ae60;">Rp 0</p>
        </div>
    </div>

    <!-- Tabel Detail Laporan Harian -->
    <div class="card-section">
        <h3 style="margin-top: 0; color: #2c3e50; border-bottom: 2px solid #ecf0f1; padding-bottom: 12px;">Riwayat Laporan Penjualan</h3>
        
        <table id="tabelLaporan" style="width: 100%; border-collapse: collapse; margin-top: 15px;">
            <thead>
                <tr>
                    <th style="padding: 12px; border-bottom: 2px solid #ecf0f1; text-align: left;">ID Nota</th>
                    <th style="padding: 12px; border-bottom: 2px solid #ecf0f1; text-align: left;">Kasir</th>
                    <th style="padding: 12px; border-bottom: 2px solid #ecf0f1; text-align: left;">Waktu Transaksi</th>
                    <th style="padding: 12px; border-bottom: 2px solid #ecf0f1; text-align: left;">Jumlah Item</th>
                </tr>
            </thead>
            <tbody>
                <tr><td colspan="4" style="text-align: center; padding: 20px;">Memuat data laporan...</td></tr>
            </tbody>
        </table>
    </div>

</div>

<script>
    // Ambil data laporan harian dari backend saat halaman dimuat
    async function muatDashboard() {
        try {
            const response = await fetch('http://127.0.0.1:8000/laporan/harian');
            const data = await response.json();

            const tbody = document.querySelector('#tabelLaporan tbody');
            tbody.innerHTML = '';

            if (!Array.isArray(data) || data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4" style="text-align: center; padding: 20px;">Belum ada data transaksi tercatat.</td></tr>';
                return;
            }

            let totalTransaksi = data.length;
            let totalItemTerjual = 0;
            let totalOmzet = 0; // Variabel penampung omzet

            data.forEach(item => {
                totalItemTerjual += item.total_item;
                totalOmzet += item.grand_total || 0; // Akumulasi pendapatan

                tbody.innerHTML += `
                    <tr>
                        <td style="padding: 12px; border-bottom: 1px solid #ecf0f1;"><strong>#${item.id_nota}</strong></td>
                        <td style="padding: 12px; border-bottom: 1px solid #ecf0f1;">${item.kasir}</td>
                        <td style="padding: 12px; border-bottom: 1px solid #ecf0f1;">${item.waktu}</td>
                        <td style="padding: 12px; border-bottom: 1px solid #ecf0f1;">${item.total_item} Item</td>
                    </tr>
                `;
            });

            // Update kartu statistik di atas
            document.getElementById('statTotalTransaksi').innerText = totalTransaksi;
            document.getElementById('statTotalItem').innerText = totalItemTerjual;
            document.getElementById('statTotalOmzet').innerText = 'Rp ' + totalOmzet.toLocaleString('id-ID'); // Format rupiah

        } catch (error) {
            console.error("Gagal memuat dashboard:", error);
            document.querySelector('#tabelLaporan tbody').innerHTML = '<tr><td colspan="4" style="text-align: center; color: red; padding: 20px;">Gagal terhubung ke server backend.</td></tr>';
        }
    }

    window.onload = muatDashboard;
</script>

</body>
</html>
