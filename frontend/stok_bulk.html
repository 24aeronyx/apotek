<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Input Stok Massal (Bulk) - Apotek</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .table-input { width: 100%; border-collapse: collapse; margin-top: 15px; }
        .table-input th, .table-input td { padding: 10px; border: 1px solid #ecf0f1; text-align: left; }
        .table-input th { background: #f8f9fa; }
        .input-cell { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
        .btn-action-row { background: #e74c3c; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .btn-action-row:hover { background: #c0392b; }
        .btn-tambah-baris { background: #3498db; color: white; border: none; padding: 10px 15px; border-radius: 6px; cursor: pointer; font-weight: bold; margin-top: 15px; }
        .btn-simpan-semua { background: #2ecc71; color: white; border: none; padding: 12px 20px; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 20px; width: 100%; }
    </style>
</head>
<body>

<div class="header">
    <h2>📦 Input Stok Massal (Bulk)</h2>
    <div>
        <a href="index.html" style="text-decoration: none; background: #3498db; color: white; padding: 10px 15px; border-radius: 20px; font-weight: bold; font-size: 14px;">🛒 Ke Kasir</a>
    </div>
</div>

<div class="container" style="max-width: 1000px;">
    <div style="background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); border: 1px solid #ecf0f1;">
        <h3 style="margin-top: 0; color: #2c3e50; border-bottom: 2px solid #ecf0f1; padding-bottom: 10px;">Daftar Obat Masuk</h3>
        <p style="color: #7f8c8d; font-size: 14px;">Tambahkan baris sebanyak yang Anda inginkan, isi datanya, lalu klik simpan untuk memasukkan semuanya sekaligus secara instan.</p>

        <form id="formBulkStok" onsubmit="kirimDataBulk(event)">
            <table class="table-input" id="tabelInputBulk">
                <thead>
                    <tr>
                        <th style="width: 25%;">Nama Obat</th>
                        <th style="width: 18%;">Kategori</th>
                        <th style="width: 15%;">Harga Jual (Rp)</th>
                        <th style="width: 12%;">Jumlah</th>
                        <th style="width: 20%;">Kedaluwarsa</th>
                        <th style="width: 10%; text-align: center;">Aksi</th>
                    </tr>
                </thead>
                <tbody id="tbodyBulk">
                    <!-- Baris input dinamis akan ditambahkan di sini -->
                </tbody>
            </table>

            <button type="button" class="btn-tambah-baris" onclick="tambahBarisInput()">+ Tambah Obat</button>
            <button type="submit" class="btn-simpan-semua">💾 Simpan Semua ke Database</button>
        </form>

        <div id="pesanBulk" style="margin-top: 15px; padding: 12px; border-radius: 6px; display: none; text-align: center; font-weight: bold;"></div>
    </div>
</div>

<script>
    // Saat halaman dimuat, langsung berikan 3 baris kosong awal secara otomatis
    window.onload = function() {
        tambahBarisInput();
    };

    function tambahBarisInput() {
        const tbody = document.getElementById('tbodyBulk');
        const row = document.createElement('tr');
        
        row.innerHTML = `
            <td><input type="text" class="input-cell nama-obat" required placeholder="Contoh: Paracetamol"></td>
            <td><input type="text" class="input-cell kategori" value="Umum" placeholder="Kategori"></td>
            <td><input type="number" class="input-cell harga" required min="0" placeholder="5000"></td>
            <td><input type="number" class="input-cell jumlah" required min="1" placeholder="10"></td>
            <td><input type="date" class="input-cell tgl" required></td>
            <td style="text-align: center;"><button type="button" class="btn-action-row" onclick="hapusBaris(this)">X</button></td>
        `;
        tbody.appendChild(row);
    }

    function hapusBaris(button) {
        const row = button.closest('tr');
        const tbody = document.getElementById('tbodyBulk');
        
        // Sisakan minimal 1 baris agar tabel tidak kosong total
        if (tbody.rows.length > 1) {
            row.remove();
        } else {
            alert("Minimal harus ada 1 baris input!");
        }
    }

    async function kirimDataBulk(event) {
        event.preventDefault();

        const pesanDiv = document.getElementById('pesanBulk');
        pesanDiv.style.display = 'block';
        pesanDiv.style.background = '#f1c40f';
        pesanDiv.style.color = 'black';
        pesanDiv.innerText = 'Mengirim data massal...';

        // Kumpulkan semua data dari setiap baris tabel
        const rows = document.querySelectorAll('#tbodyBulk tr');
        let itemsArray = [];

        rows.forEach(row => {
            itemsArray.push({
                nama_obat: row.querySelector('.nama-obat').value,
                kategori: row.querySelector('.kategori').value,
                harga_jual: parseInt(row.querySelector('.harga').value),
                jumlah: parseInt(row.querySelector('.jumlah').value),
                tanggal_kedaluwarsa: row.querySelector('.tgl').value
            });
        });

        const payload = { items: itemsArray };

        try {
            const response = await fetch('http://127.0.0.1:8000/stok/tambah-banyak', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            const result = await response.json();

            if (response.ok) {
                pesanDiv.style.background = '#d4edda';
                pesanDiv.style.color = '#155724';
                pesanDiv.innerText = `✅ Berhasil! ${itemsArray.length} jenis obat/batch berhasil ditambahkan ke database.`;
                
                // Reset tabel ke 3 baris kosong
                document.getElementById('tbodyBulk').innerHTML = '';
                tambahBarisInput();
            } else {
                pesanDiv.style.background = '#f8d7da';
                pesanDiv.style.color = '#721c24';
                pesanDiv.innerText = `❌ Gagal: ${result.detail || 'Terjadi kesalahan pada server'}`;
            }
        } catch (error) {
            pesanDiv.style.background = '#f8d7da';
            pesanDiv.style.color = '#721c24';
            pesanDiv.innerText = `Error server: Pastikan API backend aktif!`;
        }
    }
</script>

</body>
</html>
