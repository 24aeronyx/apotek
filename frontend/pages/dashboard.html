<div class="container" style="max-width: 1100px; margin: auto; padding: 0;">
    
    <!-- Filter Bulan & Tahun -->
    <div class="filter-container" style="display: flex; gap: 15px; align-items: center; margin-bottom: 20px; flex-wrap: wrap; background: #f8f9fa; padding: 15px; border-radius: 8px; border: 1px solid #ecf0f1;">
        <div>
            <label style="font-weight: bold; color: #2c3e50; margin-right: 8px;">Pilih Bulan:</label>
            <select id="filterBulan" class="form-control" style="padding: 8px; border-radius: 6px; border: 1px solid #ccc;" onchange="muatDashboard()">
                <option value="1">Januari</option>
                <option value="2">Februari</option>
                <option value="3">Maret</option>
                <option value="4">April</option>
                <option value="5">Mei</option>
                <option value="6">Juni</option>
                <option value="7" selected>Juli</option>
                <option value="8">Agustus</option>
                <option value="9">September</option>
                <option value="10">Oktober</option>
                <option value="11">November</option>
                <option value="12">Desember</option>
            </select>
        </div>
        <div>
            <label style="font-weight: bold; color: #2c3e50; margin-right: 8px; margin-left: 15px;">Tahun:</label>
            <select id="filterTahun" class="form-control" style="padding: 8px; border-radius: 6px; border: 1px solid #ccc;" onchange="muatDashboard()">
                <option value="2025">2025</option>
                <option value="2026" selected>2026</option>
                <option value="2027">2027</option>
            </select>
        </div>
    </div>

    <!-- Kotak Ringkasan Statistik (KPI Cards) -->
    <div class="stats-container" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 25px;">
        <div class="stat-card" style="background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); border: 1px solid #ecf0f1; text-align: center; border-left: 4px solid #3498db;">
            <h4 style="margin: 0 0 10px 0; color: #7f8c8d; font-size: 13px; text-transform: uppercase;">Total Transaksi</h4>
            <p id="statTotalTransaksi" style="margin: 0; color: #3498db; font-size: 22px; font-weight: bold;">0</p>
        </div>
        <div class="stat-card" style="background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); border: 1px solid #ecf0f1; text-align: center; border-left: 4px solid #e67e22;">
            <h4 style="margin: 0 0 10px 0; color: #7f8c8d; font-size: 13px; text-transform: uppercase;">Item Terjual</h4>
            <p id="statTotalItem" style="margin: 0; color: #e67e22; font-size: 22px; font-weight: bold;">0</p>
        </div>
        <div class="stat-card" style="background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); border: 1px solid #ecf0f1; text-align: center; border-left: 4px solid #27ae60;">
            <h4 style="margin: 0 0 10px 0; color: #7f8c8d; font-size: 13px; text-transform: uppercase;">Total Omzet (Pendapatan)</h4>
            <p id="statTotalOmzet" style="margin: 0; color: #27ae60; font-size: 22px; font-weight: bold;">Rp 0</p>
        </div>
        <div class="stat-card" style="background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); border: 1px solid #ecf0f1; text-align: center; border-left: 4px solid #8e44ad;">
            <h4 style="margin: 0 0 10px 0; color: #7f8c8d; font-size: 13px; text-transform: uppercase;">Estimasi Laba Bersih</h4>
            <p id="statTotalLaba" style="margin: 0; color: #8e44ad; font-size: 22px; font-weight: bold;">Rp 0</p>
        </div>
    </div>

    <!-- Bagian Grafik / Chart Transaksi Per Hari -->
    <div class="card-section" style="background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); border: 1px solid #ecf0f1; margin-bottom: 20px;">
        <h3 style="margin-top: 0; color: #2c3e50; border-bottom: 2px solid #ecf0f1; padding-bottom: 12px; font-size: 18px;">Grafik Tren Pendapatan Harian</h3>
        <div style="position: relative; height: 300px; width: 100%;">
            <canvas id="chartOmzet"></canvas>
        </div>
    </div>

    <!-- Tabel Detail Laporan Bulanan + Tombol Export -->
    <div class="card-section" style="background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); border: 1px solid #ecf0f1; margin-bottom: 20px;">
        <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #ecf0f1; padding-bottom: 12px; margin-bottom: 15px; flex-wrap: wrap; gap: 10px;">
            <h3 style="margin: 0; color: #2c3e50; font-size: 18px;">Riwayat Laporan Penjualan</h3>
            <div style="display: flex; gap: 8px;">
                <button type="button" class="btn-export-excel" onclick="exportKeExcel()" style="background: #27ae60; color: white; border: none; padding: 10px 15px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 14px; display: inline-flex; align-items: center; gap: 6px;"><i class="fa-solid fa-file-excel"></i> Export ke Excel</button>
                <button type="button" class="btn-export-pdf" onclick="exportKePDF()" style="background: #c0392b; color: white; border: none; padding: 10px 15px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 14px; display: inline-flex; align-items: center; gap: 6px;"><i class="fa-solid fa-file-pdf"></i> Export ke PDF</button>
            </div>
        </div>
        
        <div style="overflow-x: auto;" id="wrapperTabelLaporan">
            <table id="tabelLaporan" style="width: 100%; border-collapse: collapse; text-align: left;">
                <thead>
                    <tr>
                        <th style="padding: 12px; border-bottom: 2px solid #ecf0f1; background: #f8f9fa; color: #2c3e50;">ID Nota</th>
                        <th style="padding: 12px; border-bottom: 2px solid #ecf0f1; background: #f8f9fa; color: #2c3e50;">Kasir</th>
                        <th style="padding: 12px; border-bottom: 2px solid #ecf0f1; background: #f8f9fa; color: #2c3e50;">Waktu Transaksi</th>
                        <th style="padding: 12px; border-bottom: 2px solid #ecf0f1; background: #f8f9fa; color: #2c3e50;">Jumlah Item</th>
                        <th style="padding: 12px; border-bottom: 2px solid #ecf0f1; background: #f8f9fa; color: #2c3e50; text-align: right;">Grand Total</th>
                        <th style="padding: 12px; border-bottom: 2px solid #ecf0f1; background: #f8f9fa; color: #2c3e50; text-align: right;">Perkiraan Laba</th>
                    </tr>
                </thead>
                <tbody>
                    <tr><td colspan="6" style="text-align: center; padding: 20px;">Memuat data laporan...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

</div>

<!-- Modal Kustom untuk Peringatan / Pesan -->
<div id="modalAlert" class="modal-overlay" style="display: none; align-items: center; justify-content: center; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000;">
    <div class="modal-content" style="background: white; padding: 25px; border-radius: 12px; width: 90%; max-width: 400px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); text-align: center;">
        <div style="font-size: 45px; color: #e67e22; margin-bottom: 10px;"><i class="fa-solid fa-circle-exclamation"></i></div>
        <h3 style="margin-top: 0; color: #2c3e50;" id="alertTitle">Peringatan</h3>
        <p style="color: #555; font-size: 14px; margin-bottom: 20px;" id="alertMessage">Pesan informasi.</p>
        <button type="button" onclick="tutupModalAlert()" style="background: #3498db; color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-weight: bold; width: 100%;">OK</button>
    </div>
</div>

<!-- Memanggil JavaScript Dashboard -->
<script src="/static/js/dashboard.js"></script>
