<!-- Konten Kasir Utama dengan Split Screen -->
<div class="container" style="max-width: 100%; padding: 15px; box-sizing: border-box;">
    
    <!-- Layout Grid Utama (Kiri: Produk, Kanan: Preview Nota/Kasir) -->
    <div style="display: grid; grid-template-columns: 1fr 420px; gap: 20px; align-items: start; height: calc(100vh - 100px);">
        
        <!-- KOLOM KIRI: Pencarian & Grid Produk -->
        <div style="display: flex; flex-direction: column; height: 100%; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); border: 1px solid #ecf0f1; overflow: hidden;">
            
            <!-- Baris Pencarian & Tombol Riwayat -->
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; gap: 10px;">
                <div style="display: flex; align-items: center; gap: 10px; flex-grow: 1;">
                    <i class="fa-solid fa-magnifying-glass" style="color: #7f8c8d;"></i>
                    <input type="text" class="form-control search-box" id="searchInput" placeholder="Cari nama obat cepat..." onkeyup="filterObat()" style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 8px; outline: none;">
                </div>
                <button onclick="bukaRiwayat()" style="background: #3498db; color: white; border: none; padding: 10px 16px; border-radius: 8px; cursor: pointer; font-weight: bold; display: flex; align-items: center; gap: 8px; white-space: nowrap;">
                    <i class="fa-solid fa-clock-rotate-left"></i> Riwayat
                </button>
            </div>

            <!-- Grid Produk (Bisa di-scroll jika banyak) -->
            <div class="product-grid" id="productGrid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 15px; overflow-y: auto; padding-right: 5px; flex-grow: 1;"></div>
        </div>

        <!-- KOLOM KANAN: Preview Nota / Keranjang Belanja -->
        <div style="background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); border: 1px solid #ecf0f1; display: flex; flex-direction: column; height: 100%; box-sizing: border-box;">
            <div style="border-bottom: 2px solid #ecf0f1; padding-bottom: 10px; margin-bottom: 15px;">
                <h3 style="margin: 0; color: #2c3e50; font-size: 18px;"><i class="fa-solid fa-receipt"></i> Preview Nota Kasir</h3>
            </div>
            
            <!-- Tabel Item Keranjang (Scrollable) -->
            <div style="flex-grow: 1; overflow-y: auto; max-height: calc(100vh - 380px); margin-bottom: 15px;">
                <table id="tabelKeranjang" style="width: 100%; border-collapse: collapse; text-align: left; font-size: 13px;">
                    <thead>
                        <tr style="background: #f8f9fa; position: sticky; top: 0; z-index: 10;">
                            <th style="padding: 8px; border-bottom: 2px solid #ecf0f1;">Obat</th>
                            <th style="padding: 8px; border-bottom: 2px solid #ecf0f1; text-align: center;">Jml</th>
                            <th style="padding: 8px; border-bottom: 2px solid #ecf0f1; text-align: right;">Subtotal</th>
                            <th style="padding: 8px; border-bottom: 2px solid #ecf0f1; text-align: center;">Aksi</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>

            <!-- Ringkasan & Pembayaran -->
            <div style="border-top: 2px solid #ecf0f1; padding-top: 12px;">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; font-size: 18px; font-weight: bold;">
                    <span>Total Bayar:</span>
                    <span id="grandTotal" style="color: #27ae60;">Rp 0</span>
                </div>

                <!-- Input Uang Diterima & Kembalian -->
                <div style="margin-bottom: 12px; padding: 10px; background: #f8f9fa; border-radius: 8px; border: 1px solid #ecf0f1;">
                    <label style="display: block; font-weight: bold; color: #2c3e50; margin-bottom: 4px; font-size: 12px;">Uang Tunai Diterima (Rp):</label>
                    <input type="number" id="inputUangDiterima" class="form-control" placeholder="Contoh: 50000" style="width: 100%; padding: 8px; font-size: 14px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box;" onkeyup="hitungKembalian()" onchange="hitungKembalian()">
                    
                    <div style="margin-top: 8px; display: flex; justify-content: space-between; align-items: center; font-size: 14px;">
                        <span style="font-weight: bold; color: #555;">Uang Kembalian:</span>
                        <span id="labelKembalian" style="font-weight: bold; color: #e74c3c; font-size: 15px;">Rp 0</span>
                    </div>
                </div>

                <button class="btn-proses" id="btnProsesPembayaran" onclick="prosesTransaksi()" style="background: #2ecc71; color: white; border: none; padding: 12px; width: 100%; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 15px;">✔ Proses Pembayaran</button>
                <div id="pesan" style="margin-top: 8px; text-align: center; font-weight: bold; font-size: 13px;"></div>
            </div>
        </div>

    </div>
</div>

<!-- Modal Pop-up Riwayat Transaksi (Tetap dipertahankan) -->
<div class="modal-overlay" id="riwayatModal" style="display: none; align-items: center; justify-content: center; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000;">
    <div class="modal-content" style="background: white; padding: 25px; border-radius: 12px; width: 90%; max-width: 700px; box-shadow: 0 10px 25px rgba(0,0,0,0.2);">
        <div class="modal-header" style="display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #ecf0f1; padding-bottom: 10px; margin-bottom: 15px;">
            <h3 style="margin: 0; color: #2c3e50;">📜 Riwayat Transaksi</h3>
            <button class="close-btn" onclick="tutupRiwayat()" style="background: none; border: none; font-size: 22px; cursor: pointer; color: #7f8c8d;">&times;</button>
        </div>
        <div style="max-height: 350px; overflow-y: auto;">
            <table id="tabelRiwayat" style="width: 100%; border-collapse: collapse; text-align: left;">
                <thead>
                    <tr style="background: #f8f9fa;">
                        <th style="padding: 10px; border-bottom: 2px solid #ecf0f1;">ID Nota</th>
                        <th style="padding: 10px; border-bottom: 2px solid #ecf0f1;">Kasir</th>
                        <th style="padding: 10px; border-bottom: 2px solid #ecf0f1;">Waktu</th>
                        <th style="padding: 10px; border-bottom: 2px solid #ecf0f1;">Total Item</th>
                        <th style="padding: 10px; border-bottom: 2px solid #ecf0f1; text-align: center;">Aksi</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </div>
</div>

<!-- Area Struk Tersembunyi untuk Printer -->
<div id="areaStruk" style="display: none;">
    <div style="width: 300px; font-family: 'Courier New', Courier, monospace; font-size: 12px; padding: 10px; color: black;">
        <div style="text-align: center; border-bottom: 1px dashed black; padding-bottom: 5px; margin-bottom: 5px;">
            <h3 style="margin: 0;">APOTEK SEHAT MANDIRI</h3>
            <p style="margin: 2px 0;">Jl. Contoh No. 123, Kota Anda</p>
        </div>
        <div style="margin-bottom: 5px;">
            <p style="margin: 2px 0;">No. Nota : <span id="strukId">-</span></p>
            <p style="margin: 2px 0;">Waktu  : <span id="strukWaktu">-</span></p>
            <p style="margin: 2px 0;">Kasir    : <span id="strukKasir">-</span></p>
        </div>
        <div style="border-top: 1px dashed black; border-bottom: 1px dashed black; padding: 5px 0; margin-bottom: 5px;">
            <table style="width: 100%; font-size: 12px; border-collapse: collapse;">
                <tbody id="strukItemBody"></tbody>
            </table>
        </div>
        <div style="text-align: right; font-weight: bold; margin-bottom: 5px;">
            <p style="margin: 2px 0;">TOTAL: <span id="strukTotal">Rp 0</span></p>
            <p style="margin: 2px 0;">TUNAI: <span id="strukTunai">Rp 0</span></p>
            <p style="margin: 2px 0;">KEMBALI: <span id="strukKembali">Rp 0</span></p>
        </div>
        <div style="text-align: center; border-top: 1px dashed black; padding-top: 5px;">
            <p style="margin: 2px 0;">Terima Kasih</p>
        </div>
    </div>
</div>
