<div class="container" style="max-width: 1100px; margin: auto;">
    <div class="card-section" style="background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); border: 1px solid #ecf0f1; margin-bottom: 20px;">
        
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; flex-wrap: wrap; gap: 10px;">
            <div style="display: flex; align-items: center; gap: 10px; width: 100%; max-width: 400px;">
                <input type="text" id="inputCari" class="search-input" placeholder="🔍 Cari nama obat di master..." onkeyup="filterMaster()" style="width: 100%; padding: 10px 15px; border: 1px solid #ccc; border-radius: 8px; font-size: 14px; outline: none;">
            </div>
            <button type="button" class="btn-tambah" onclick="bukaModalTambah()" style="background: #2ecc71; color: white; border: none; padding: 10px 18px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 14px; display: flex; align-items: center; gap: 8px;">
                <i class="fa-solid fa-plus"></i> Tambah Obat Baru
            </button>
        </div>

        <div style="overflow-x: auto;">
            <table class="table-master" id="tabelMaster" style="width: 100%; border-collapse: collapse; margin-top: 15px;">
                <thead>
                    <tr>
                        <th style="width: 8%; padding: 12px; border-bottom: 2px solid #ecf0f1; background: #f8f9fa; color: #2c3e50;">Gambar</th>
                        <th style="width: 30%; padding: 12px; border-bottom: 2px solid #ecf0f1; background: #f8f9fa; color: #2c3e50;">Nama Obat</th>
                        <th style="width: 15%; padding: 12px; border-bottom: 2px solid #ecf0f1; background: #f8f9fa; color: #2c3e50;">Kategori</th>
                        <th style="width: 18%; padding: 12px; border-bottom: 2px solid #ecf0f1; background: #f8f9fa; color: #2c3e50;">Harga Jual</th>
                        <th style="width: 12%; text-align: center; padding: 12px; border-bottom: 2px solid #ecf0f1; background: #f8f9fa; color: #2c3e50;">Total Stok</th>
                        <th style="width: 17%; text-align: center; padding: 12px; border-bottom: 2px solid #ecf0f1; background: #f8f9fa; color: #2c3e50;">Aksi</th>
                    </tr>
                </thead>
                <tbody>
                    <tr><td colspan="6" style="text-align: center; padding: 20px;">Memuat data master obat...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- Modal Form Tambah/Edit Master Obat -->
<div id="modalMaster" class="modal-overlay" style="display: none; align-items: center; justify-content: center; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000;">
    <div class="modal-content" style="background: white; padding: 25px; border-radius: 12px; width: 90%; max-width: 500px; box-shadow: 0 10px 25px rgba(0,0,0,0.2);">
        <h3 id="modalTitle" style="margin-top: 0; color: #2c3e50; border-bottom: 2px solid #ecf0f1; padding-bottom: 10px;">Tambah Obat Baru</h3>
        <form id="formMaster" onsubmit="simpanMasterObat(event)">
            <input type="hidden" id="obatId">
            <div class="form-group" style="margin-bottom: 15px;">
                <label style="display: block; margin-bottom: 5px; font-weight: bold; color: #2c3e50; font-size: 14px;">Nama Obat (Beserta Merk/Pabrik): <span style="color: red;">*</span></label>
                <input type="text" id="namaObat" class="form-control" style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 14px;" placeholder="Contoh: Amoxilin 500mg - Pharos" required>
            </div>
            <div class="form-group" style="margin-bottom: 15px;">
                <label style="display: block; margin-bottom: 5px; font-weight: bold; color: #2c3e50; font-size: 14px;">Kategori: <span style="color: red;">*</span></label>
                <input type="text" id="kategoriObat" class="form-control" style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 14px;" value="Umum" required>
            </div>
            <div class="form-group" style="margin-bottom: 15px;">
                <label style="display: block; margin-bottom: 5px; font-weight: bold; color: #2c3e50; font-size: 14px;">Harga Jual Standar (Rp): <span style="color: red;">*</span></label>
                <input type="number" id="hargaJual" class="form-control" style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 14px;" value="0" min="0" required>
            </div>
            <div class="form-group" style="margin-bottom: 15px;">
                <label style="display: block; margin-bottom: 5px; font-weight: bold; color: #2c3e50; font-size: 14px;">Upload Gambar Obat: <span style="color: #7f8c8d; font-weight: normal; font-size: 12px;">(Opsional / Tidak wajib)</span></label>
                <input type="file" id="fileGambar" class="form-control" style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 14px;" accept="image/*">
            </div>
            
            <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 20px;">
                <div style="display: flex; gap: 10px; margin-left: auto;">
                    <button type="button" onclick="tutupModal()" style="background: #95a5a6; color: white; border: none; padding: 10px 15px; border-radius: 6px; cursor: pointer; font-weight: bold;">Batal</button>
                    <button type="submit" style="background: #2ecc71; color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-weight: bold;">Simpan</button>
                </div>
            </div>
        </form>
    </div>
</div>

<!-- Modal Pantau Batch & Expired Date -->
<div id="modalBatch" class="modal-overlay" style="display: none; align-items: center; justify-content: center; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000;">
    <div class="modal-content" style="background: white; padding: 25px; border-radius: 12px; width: 90%; max-width: 650px; box-shadow: 0 10px 25px rgba(0,0,0,0.2);">
        <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #ecf0f1; padding-bottom: 10px; margin-bottom: 15px;">
            <h3 id="judulDetailBatch" style="margin: 0; color: #2c3e50;"><i class="fa-solid fa-layer-group" style="color: #3498db;"></i> Rincian Batch & Kedaluwarsa</h3>
            <button class="close-btn" onclick="tutupModalBatch()" style="background: none; border: none; font-size: 22px; cursor: pointer; color: #7f8c8d;">&times;</button>
        </div>
        
        <div style="max-height: 350px; overflow-y: auto;">
            <table class="table-master" style="width: 100%; border-collapse: collapse; margin-top: 0;" id="tabelRincianBatch">
                <thead>
                    <tr>
                        <th style="padding: 10px; border-bottom: 2px solid #ecf0f1; background: #f8f9fa;">No. Faktur / Batch</th>
                        <th style="padding: 10px; border-bottom: 2px solid #ecf0f1; background: #f8f9fa;">Sisa Stok</th>
                        <th style="padding: 10px; border-bottom: 2px solid #ecf0f1; background: #f8f9fa;">Harga Modal (Beli)</th>
                        <th style="padding: 10px; border-bottom: 2px solid #ecf0f1; background: #f8f9fa;">Tgl. Kedaluwarsa</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Data batch akan dimuat di sini -->
                </tbody>
            </table>
        </div>
        <div style="text-align: right; margin-top: 20px;">
            <button type="button" onclick="tutupModalBatch()" style="background: #3498db; color: white; border: none; padding: 8px 18px; border-radius: 6px; cursor: pointer; font-weight: bold;">Tutup</button>
        </div>
    </div>
</div>

<!-- Modal Konfirmasi Hapus -->
<div id="modalHapus" class="modal-overlay" style="display: none; align-items: center; justify-content: center; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000;">
    <div class="modal-content" style="background: white; padding: 25px; border-radius: 12px; width: 90%; max-width: 400px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); text-align: center;">
        <div style="font-size: 45px; color: #e74c3c; margin-bottom: 10px;"><i class="fa-solid fa-triangle-exclamation"></i></div>
        <h3 style="margin-top: 0; color: #2c3e50;">Konfirmasi Hapus</h3>
        <p style="color: #555; font-size: 14px; margin-bottom: 20px;">Apakah Anda yakin ingin menghapus obat ini dari master?</p>
        <input type="hidden" id="idObatDihapus">
        <div style="display: flex; gap: 10px; justify-content: center;">
            <button type="button" onclick="tutupModalHapus()" style="background: #95a5a6; color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-weight: bold;">Batal</button>
            <button type="button" onclick="eksekusiHapus()" style="background: #e74c3c; color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-weight: bold;">Ya, Hapus</button>
        </div>
    </div>
</div>

<!-- Modal Peringatan Error -->
<div id="modalAlert" class="modal-overlay" style="display: none; align-items: center; justify-content: center; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000;">
    <div class="modal-content" style="background: white; padding: 25px; border-radius: 12px; width: 90%; max-width: 400px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); text-align: center;">
        <div style="font-size: 45px; color: #e67e22; margin-bottom: 10px;"><i class="fa-solid fa-circle-exclamation"></i></div>
        <h3 style="margin-top: 0; color: #2c3e50;" id="alertTitle">Peringatan</h3>
        <p style="color: #555; font-size: 14px; margin-bottom: 20px;" id="alertMessage">Terjadi kesalahan.</p>
        <button type="button" onclick="tutupModalAlert()" style="background: #3498db; color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-weight: bold; width: 100%;">OK</button>
    </div>
</div>

<!-- Memanggil JavaScript Master Obat -->
<script src="/static/js/master_obat.js"></script>
